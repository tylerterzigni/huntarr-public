# Build and push Huntarr images to GHCR from huntarr-public (main publish repo).
# Image: ghcr.io/<owner>/huntarr
#
# Tags on push to main:
#   :production  (homelab host pin — same tag as before)
#   :latest
#   :main
#   :sha-<shortsha>
#
# Secrets: never bake .env / AUTH_* / SETTINGS_ENCRYPTION_KEY / API keys into the image.
# Runtime config comes from the host compose env_file / environment.

name: Docker Publish

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Keep package name `huntarr` so homelab host compose can keep pulling
  # ghcr.io/<owner>/huntarr:production without a mega-compose rename.
  IMAGE_NAME: ${{ github.repository_owner }}/huntarr

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=production,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{raw}}
          labels: |
            org.opencontainers.image.title=Huntarr
            org.opencontainers.image.description=Homelab media discovery for *arr stacks
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Resolve version build-arg
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            REVISION=${{ github.sha }}
            IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}
            IMAGE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
