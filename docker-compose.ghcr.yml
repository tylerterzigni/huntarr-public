# GHCR pull overlay — use the published image instead of a local build.
#
# Prerequisites:
#   docker login ghcr.io -u tylerterzigni --password-stdin   # PAT with read:packages
#   .env present (copy from .env.example; set AUTH_URL to the URL clients use)
#
# Usage (keeps Windows default compose + named volume postgres_data):
#   docker compose -f docker-compose.yml -f docker-compose.ghcr.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.ghcr.yml up -d
#
# Optional tag override:
#   HUNTARR_IMAGE=ghcr.io/YOUR_GITHUB_USER/huntarr:test docker compose -f docker-compose.yml -f docker-compose.ghcr.yml up -d
#
# Default local workflow is unchanged:
#   docker compose up -d --build
#
# For MediaServer bind-mount Postgres, prefer:
#   deploy/docker-compose.mediaserver.yml

services:
  app:
    image: ${HUNTARR_IMAGE:-ghcr.io/YOUR_GITHUB_USER/huntarr:production}
    build: !reset null
