# Optional: pull a pre-built image instead of building locally.
#
# Prerequisites:
#   docker login ghcr.io -u YOUR_GITHUB_USER --password-stdin   # PAT with read:packages
#   .env present (copy from .env.example; set AUTH_URL to the URL clients use)
#
# Usage (with the default compose + named volume postgres_data):
#   docker compose -f docker-compose.yml -f docker-compose.ghcr.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.ghcr.yml up -d
#
# Optional tag override:
#   HUNTARR_IMAGE=ghcr.io/YOUR_GITHUB_USER/huntarr-public:latest docker compose -f docker-compose.yml -f docker-compose.ghcr.yml up -d
#
# Default local workflow (no GHCR required):
#   docker compose up -d --build

services:
  app:
    image: ${HUNTARR_IMAGE:-ghcr.io/YOUR_GITHUB_USER/huntarr-public:latest}
    build: !reset null
