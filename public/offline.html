<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e5e7eb" />
    <title>Huntarr — Offline</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        padding-top: calc(1.5rem + env(safe-area-inset-top, 0px));
        padding-bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px));
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #e5e7eb;
        color: #111827;
      }
      .card {
        max-width: 22rem;
        width: 100%;
        padding: 1.75rem 1.5rem;
        text-align: center;
        border: 1px solid rgba(209, 213, 219, 0.7);
        background: rgba(255, 255, 255, 0.4);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-radius: 0.5rem;
        box-shadow: none;
      }
      .logo {
        width: 4rem;
        height: 4rem;
        margin: 0 auto 1rem;
        border-radius: 0.75rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
        font-weight: 600;
      }
      p {
        margin: 0 0 1.25rem;
        font-size: 0.875rem;
        line-height: 1.5;
        color: #4b5563;
      }
      button {
        cursor: pointer;
        border: 1px solid rgba(209, 213, 219, 0.7);
        background: rgba(255, 255, 255, 0.4);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        color: #111827;
        font-size: 0.875rem;
        font-weight: 500;
        padding: 0.625rem 1.25rem;
        border-radius: 0.375rem;
        box-shadow: none;
      }
      button:hover {
        border-color: rgba(156, 163, 175, 1);
        background: rgba(255, 255, 255, 0.55);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="logo" src="/icons/android-chrome-192x192.png" alt="Huntarr" width="64" height="64" />
      <h1>Can&rsquo;t reach Huntarr</h1>
      <p>
        Check that your Huntarr server is running and your phone is on the same Wi&#8209;Fi network.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
